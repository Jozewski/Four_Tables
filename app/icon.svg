<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Four Tables icon">
  <rect width="64" height="64" rx="14" fill="#fff8f1"/>
  <rect x="8" y="8" width="48" height="48" rx="10" fill="#fff1e7" stroke="#18181b" stroke-width="4"/>

  <!-- Four tiles -->
  <line x1="32" y1="12" x2="32" y2="52" stroke="#18181b" stroke-width="4" stroke-linecap="round"/>
  <line x1="12" y1="32" x2="52" y2="32" stroke="#18181b" stroke-width="4" stroke-linecap="round"/>

  <!-- Accent center mark -->
  <circle cx="32" cy="32" r="5" fill="#d96a27" stroke="#18181b" stroke-width="2"/>
</svg>
